name: PR gate

# Validates a submission completely before any human is asked to review, then
# requests review from every code owner (except the author and the sync bot).
#
# pull_request_target is required to comment and assign reviewers on fork PRs.
# SAFETY: this workflow never checks out or executes code from the PR; the PR's
# changes are only read as data through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate submission and manage reviewers
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            // Re-fetch the PR: webhook events can arrive out of order, and a run for
            // an older head must not overwrite the verdict for the current one.
            const { data: pr } = await github.rest.pulls.get(
              { owner, repo, pull_number: context.payload.pull_request.number });
            if (context.payload.pull_request.head.sha !== pr.head.sha) {
              core.info('Stale event (head moved on); skipping.');
              return;
            }
            const MARKER = '<!-- pr-gate -->';
            const problems = [];
            const notes = [];
            let caveat = false;

            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });

            // Compare each changed file's CONTENT at the PR head against current main.
            // The ADO mirror force-pushes rewritten history, which makes merge-base
            // diffs show phantom changes on stale branches; content comparison is
            // immune to that, and to newline-at-EOF noise in patches.
            // Retry transient API failures; a throttled read must abort the run rather
            // than silently misjudge the PR (burst-testing produced false "adds 0 lines"
            // verdicts when secondary rate limits made reads fail quietly).
            const withRetry = async (fn) => {
              let last;
              for (let i = 0; i < 3; i++) {
                try { return await fn(); }
                catch (e) { last = e; if (e.status === 404) throw e; await new Promise(r => setTimeout(r, 3000 * (i + 1))); }
              }
              throw last;
            };
            const getText = async (path, ref) => {
              try {
                const { data } = await withRetry(() => github.rest.repos.getContent({ owner, repo, path, ref }));
                return Buffer.from(data.content, 'base64').toString('utf8');
              } catch (e) {
                if (e.status === 404) return null; // genuinely absent
                throw e; // transient: fail the run, do not judge
              }
            };
            const changed = [];
            for (const f of files) {
              const headText = f.status === 'removed' ? null : await getText(f.filename, pr.head.sha);
              const baseText = await getText(f.filename, pr.base.ref);
              if (baseText !== null && headText !== null && baseText === headText) continue; // phantom
              changed.push({ filename: f.filename, headText, baseText });
            }

            const badFiles = changed.filter(c => !/^contributable_lists\/[^/]+\.txt$/.test(c.filename));
            if (badFiles.length) {
              problems.push('Only files in `contributable_lists/` may change (`extensions.txt` is generated). Touched: '
                + badFiles.map(c => '`' + c.filename + '`').join(', ')
                + '. If you did not edit these files yourself, your branch is behind a rewritten main: click "Update branch" and the gate will re-run.');
            }

            // line-set difference per category file: order-independent, newline-safe
            const setOf = t => new Set((t || '').split('\n').map(s => s.trim()).filter(Boolean));
            const added = [];
            let removed = 0;
            for (const c of changed) {
              if (badFiles.includes(c)) continue;
              const h = setOf(c.headText), b = setOf(c.baseText);
              for (const l of h) if (!b.has(l)) added.push(l);
              for (const l of b) if (!h.has(l)) removed++;
            }

            // Removals/edits of existing entries are maintainer work: the gate cannot
            // judge them, so it hands straight to humans without the strict checks.
            const maintainerPath = removed > 0 && badFiles.length === 0;
            if (maintainerPath) {
              notes.push('Removes or edits existing entries; automated store verification does not apply. Maintainer judgment required.');
            }

            let entry = null;
            if (!maintainerPath && !badFiles.length) {
              if (added.length !== 1) {
                problems.push('Exactly one extension per pull request: this PR adds ' + added.length + ' lines.');
              } else {
                const m = added[0].match(/^([a-p]{32})\s+\/\/\s*(.+)$/);
                if (!m) {
                  problems.push('The added line must be `<32-character id, letters a-p> // <store name>`. Got: `' + added[0] + '`');
                } else {
                  entry = { id: m[1], desc: m[2].trim() };
                }
              }
            }

            if (entry) {
              // duplicate check against every category file on the base branch
              const { data: dir } = await withRetry(() => github.rest.repos.getContent(
                { owner, repo, path: 'contributable_lists', ref: pr.base.ref }));
              for (const item of dir) {
                const text = await getText(item.path, pr.base.ref);
                if (text && text.includes(entry.id)) {
                  problems.push('This ID is already listed in `' + item.path + '`.');
                }
              }

              const norm = s => s.toLowerCase().replace(/&amp;/g, '&').replace(/[^a-z0-9]/g, '');
              const nameMatches = (title) => {
                const a = norm(title), b = norm(entry.desc);
                return a.includes(b.slice(0, 12)) || b.includes(a.slice(0, 12));
              };

              // Edge Add-ons entries live in Microsoft's store, not Google's
              if (/edge add-ons/i.test(entry.desc)) {
                const res = await withRetry(() => fetch('https://microsoftedge.microsoft.com/addons/detail/' + entry.id));
                const html = await res.text();
                const tm = html.match(/<title[^>]*>([^<]*)<\/title>/);
                const title = tm ? tm[1].replace(/ - Microsoft Edge Add-ons.*$/i, '').trim() : '';
                if (title && !/^Microsoft Edge Add-ons$/i.test(title)) {
                  if (nameMatches(title)) notes.push('Edge Add-ons listing verified: "' + title + '".');
                  else problems.push('The description must match the Edge store name. Listed as "' + entry.desc + '" but the store says "' + title + '".');
                } else {
                  caveat = true;
                  notes.push('No public Edge Add-ons listing found for this ID (the Edge store also intermittently errors). A human must verify the listing manually.');
                }
              } else {
              // live store verification: the ID must resolve to the claimed product
              const res = await withRetry(() => fetch('https://chromewebstore.google.com/detail/' + entry.id));
              const html = await res.text();
              const tm = html.match(/<title>([^<]*)<\/title>/);
              const title = tm ? tm[1].replace(/ - Chrome Web Store$/, '').trim() : '';
              if (title && title !== 'Chrome Web Store') {
                if (nameMatches(title)) {
                  notes.push('Store listing verified: "' + title + '".');
                } else {
                  problems.push('The description must match the store name. Listed as "' + entry.desc + '" but the store says "' + title + '".');
                }
              } else {
                // not publicly listed: probe the Web Store package service to classify
                const crx = await withRetry(() => fetch('https://clients2.google.com/service/update2/crx?response=redirect&prodversion=126.0.0.0&acceptformat=crx3&x=id%3D'
                  + entry.id + '%26uc'));
                caveat = true;
                if (crx.status === 200 || crx.ok) {
                  notes.push('Not publicly listed, but the package exists in the Web Store (unlisted). A human must verify the vendor and distribution claim in the PR description.');
                } else if (crx.status === 404) {
                  notes.push('No public listing and no Web Store package: consistent with a self-hosted enterprise extension (like the GoGuardian entries). A human must verify the vendor documentation and requesting institution.');
                } else {
                  notes.push('No public listing; the Web Store returned ' + crx.status + '. This signature usually means a discontinued extension. A human must confirm the product is alive before merging.');
                }
              }
              }
            }

            const pass = problems.length === 0;

            // sticky result comment (updated in place on every push)
            const lines = [MARKER, '## PR gate', ''];
            if (pass && maintainerPath) lines.push('Maintainer-style change. Review requested from the code owners.');
            else if (pass && caveat) lines.push('Automated checks passed **with caveats**; review requested from the code owners.');
            else if (pass) lines.push('All automated checks passed, including live store verification. Review requested from the code owners.');
            else {
              lines.push('**Not ready for human review.** Fix the following; the gate re-runs on every push:');
              problems.forEach(p => lines.push('- ' + p));
            }
            if (notes.length) { lines.push(''); notes.forEach(n => lines.push('- ' + n)); }
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith(MARKER));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });

            // reviewers: every code owner except the PR author and the sync bot
            const { data: co } = await withRetry(() => github.rest.repos.getContent(
              { owner, repo, path: '.github/CODEOWNERS', ref: pr.base.ref }));
            const handles = Buffer.from(co.content, 'base64').toString('utf8')
              .split('\n').filter(l => !l.trim().startsWith('#'))
              .flatMap(l => [...l.matchAll(/@([A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)/g)].map(m => m[1]));
            const reviewers = [...new Set(handles)].filter(h =>
              h.toLowerCase() !== pr.user.login.toLowerCase() && h.toLowerCase() !== 'rumpusroobot');

            if (pass) {
              if (reviewers.length) {
                try {
                  await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers });
                } catch (e) {
                  if (e.status !== 422) throw e;
                  // GitHub rejects the whole request if any handle is not a collaborator (for
                  // example a new code owner who has not accepted the invitation yet). Request
                  // them one by one so one pending invite cannot fail the gate for every PR.
                  for (const reviewer of reviewers) {
                    try {
                      await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers: [reviewer] });
                    } catch (e2) {
                      if (e2.status !== 422) throw e2;
                      core.warning('Cannot request review from @' + reviewer + ' (not a collaborator yet): ' + e2.message);
                    }
                  }
                }
              }
            } else {
              const pending = (pr.requested_reviewers || []).map(u => u.login);
              if (pending.length) {
                await withRetry(() => github.rest.pulls.removeRequestedReviewers({ owner, repo, pull_number: pr.number, reviewers: pending }));
              }
              core.setFailed('PR gate: ' + problems.join(' | '));
            }
